name: Wikimedia Daily Watch

on:
  schedule:
    - cron: "0 17 * * *"  # daily
  workflow_dispatch: { }

permissions:
  contents: write  # allow committing watcher state updates

concurrency:
  group: wikimedia-daily-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAPH_ACCESS_TOKEN: ${{ secrets.TELEGRAPH_ACCESS_TOKEN }}
        run: |
          python monitor.py

      - name: Commit & push watcher state if changed
        if: always()
        run: |
          if [[ -n "$(git status --porcelain -- last_run.txt pending_report.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- last_run.txt pending_report.json
            git commit -m "chore: update watcher state [skip ci]"
            git push
          else
            echo "No watcher state changes"
          fi
